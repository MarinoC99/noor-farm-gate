    commitment: false
    paraphrases_en:
      - "how high are we here"
      - "what's the altitude"
      - "how many metres above sea level"
      - "does the height change the coffee"
    answer_en: "About 1,700 metres here. The coffee likes it — up this high the cherries ripen slowly and the taste is better for it."
    answer_sw: "Hapa ni kama mita elfu moja mia saba. Kahawa inapenda hivyo. Juu hivi, matunda ya kahawa huiva polepole na ladha huwa nzuri zaidi."
