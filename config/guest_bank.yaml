  # ---------- THE COFFEE: GROWING ----------

  - id: coffee_variety
    intent: general
    commitment: false
    paraphrases_en:
      - "what kind of coffee is this"
      - "is this arabica"
      - "what variety do you grow"
      - "which type of coffee plant is it"
    answer_en: "It's arabica. The old variety my father planted, and some newer trees on the upper rows."
    answer_sw: "Ni arabika. Aina ya zamani aliyopanda baba yangu, na miti mingine mipya kwenye safu za juu."
    verified: true          # checked by a Swahili speaker, 3 Oct

  - id: altitude
