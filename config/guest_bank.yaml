# guest_bank.yaml
#
# 50 entries, 200 guest paraphrases. Drawn from the Ondera scenario in the concept
# note: 2 hectares, coffee on the upper slope, maize and beans below, eleven years in
# the Ondera Coffee Cooperative, six or seven visitors a month by word of mouth.
#
# HOW TO FILL THIS IN
# answer_en  — what Noor would say, in her words. Write it as she'd say it, not as a
#              brochure would. Short. One or two sentences.
# answer_sw  — the Swahili she hears read back to her before she taps. This is her
#              check that the English is right, so it must match in meaning.
#
# commitment: true means the tool NEVER answers it, however well it matches. It stops
# and hands to Noor. Dates, money, anything the guest might act on, anything about
# safety or allergies.
#
# Entries marked GAP are things she probably does NOT offer. Keep them. A question
# with no good answer is the most useful record the summary screen can show her.

