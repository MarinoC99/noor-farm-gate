  # ---------- NOOR AND THE COOPERATIVE ----------

  - id: how_long_farming
    intent: general
    commitment: false
    paraphrases_en:
      - "how long have you been farming"
      - "did you grow up here"
      - "how many years have you done this"
      - "was this your parents' land"
