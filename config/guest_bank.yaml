    answer_sw: "Maisha yangu yote. Hili lilikuwa shamba la wazazi wangu kabla ya kuwa langu."
    verified: true          # checked by a Swahili speaker, 3 Oct

  - id: cooperative
    intent: general
    commitment: false
    paraphrases_en:
      - "are you part of a cooperative"
      - "do you sell on your own"
      - "what does the cooperative do"
      - "how long have you been a member"
    answer_en: "Yes, the Ondera Coffee Cooperative. Eleven years now. They collect the parchment from us after harvest."
    answer_sw: "Ndiyo, Chama cha Ushirika cha Kahawa cha Ondera. Miaka kumi na mmoja sasa. Wanachukua kahawa ya maganda kutoka kwetu baada ya mavuno."
    verified: true          # checked by a Swahili speaker, 3 Oct

