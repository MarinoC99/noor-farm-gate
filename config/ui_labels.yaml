# On-screen labels for Noor's pages (summary, drafting, review). Shown, never spoken,
# so they sit outside the rule-2 guarantee. Still marked honestly:
#
# en is the coder's English. es was machine-translated by the coding agent on
# 3 October at the team's request and NOT reviewed by a Spanish speaker. It was then
# checked for meaning by independent model passes (a blind back-translation, a "could
# Noor misread this" pass, a register pass, each flag judged three times), which changed
# seven: the four "Stopped" rows no longer say "Se detuvo", the wording of Android's
# Spanish crash message, so a count of unanswered questions cannot read as the app
# breaking. That check is a model checking a model; it is not verification. sw is TODO(human).
# A page shows the label in Noor's language when it is written, and English until then,
# and says on screen when the labels it shows are unverified.

