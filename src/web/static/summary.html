<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor's farm gate: summary</title>
<style>
  /* Same system as the conversation page: one accent, greys, type and space. Light only. */
  :root {
    color-scheme: light;
    --ink: #0d0d0d; --ink-2: #3a3a3a; --muted: #5c5c5c; --hair: #d4d4d4;
    --paper: #ffffff; --tint: #f4f4f2; --accent: #1d5c3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
               font: 20px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  p, h1, h2, ul { margin: 0; }
  main { max-width: 860px; margin: 0 auto;
         padding: calc(18px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                  calc(48px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .side { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  a.back { color: var(--ink); font-weight: 650; font-size: 1rem; text-decoration: none;
           border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; }
  h1 { font-size: 2.2rem; font-weight: 750; letter-spacing: -.01em; margin-top: 6px; }
  h2 { font-size: 1.35rem; font-weight: 750; }
  .note { font-size: .95rem; color: var(--muted); margin-top: 4px; }
  section { padding: 28px 0; border-top: 1px solid var(--hair); }
  .headline { display: flex; gap: 40px; padding: 18px 0 24px; border-top: 0; }
  .big { font-size: 3.2rem; font-weight: 750; line-height: 1; letter-spacing: -.02em; }
  .big-label { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .test-note { font-size: .9rem; color: var(--muted); }

  /* The gap: what guests asked that has no answer. The most prominent list. */
  .gaps { list-style: none; padding: 0; margin-top: 16px; display: flex; flex-direction: column; }
  .gap { display: grid; grid-template-columns: 3.4rem 1fr; gap: 4px 14px; padding: 16px 0; border-top: 1px solid var(--hair); }
  .gap:first-child { border-top: 0; }
  .count { font-size: 1.9rem; font-weight: 750; line-height: 1.1; grid-row: span 3; }
  .q-noor { font-size: 1.45rem; font-weight: 700; line-height: 1.25; }
  .q-en { font-size: 1rem; color: var(--ink-2); }
  .variants { font-size: .9rem; color: var(--muted); }

  /* Plain rows with a thin bar: number first, no colour coding beyond one accent. */
  .rows { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .row { display: grid; grid-template-columns: 2.6rem 1fr; gap: 2px 12px; align-items: baseline; }
  .row .n { font-size: 1.4rem; font-weight: 750; text-align: right; }
  .row .what { font-size: 1.05rem; font-weight: 600; }
  .row .bar { grid-column: 2; height: 6px; background: var(--tint); border-radius: 3px; overflow: hidden; }
  .row .bar i { display: block; height: 100%; background: var(--ink-2); }
  .row.accent .bar i { background: var(--accent); }
  .row .sub { grid-column: 2; font-size: .95rem; color: var(--muted); }
  .empty { color: var(--muted); font-size: 1.05rem; margin-top: 12px; }
  .status { font-size: 1.4rem; font-weight: 600; color: var(--ink-2); padding: 48px 0; }
  .toggle { display: flex; align-items: center; gap: 12px; font-size: 1rem; font-weight: 600;
            color: var(--ink-2); padding: 6px 0 2px; cursor: pointer; }
  .toggle input { width: 26px; height: 26px; accent-color: var(--accent); }
  .links { display: flex; gap: 10px; }
  button { font: inherit; font-weight: 650; color: var(--ink); background: var(--paper);
           border: 2px solid var(--ink); border-radius: 12px; min-height: 56px; padding: 10px 18px;
           touch-action: manipulation; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .gap-act { grid-column: 2; margin-top: 8px; }
  .waiting { grid-column: 2; margin-top: 6px; font-size: .95rem; font-weight: 700; color: var(--accent); }
  .draft { grid-column: 2; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .draft textarea { font: inherit; font-size: 1.3rem; line-height: 1.3; padding: 12px 14px; min-height: 120px;
                    border: 2px solid var(--ink); border-radius: 12px; resize: vertical; width: 100%; }
  .draft .hint { font-size: .9rem; color: var(--muted); }
  .draft .row-btns { display: flex; gap: 10px; }
  .draft .error { color: var(--ink); font-weight: 700; font-size: .95rem; }
  .error-line { color: var(--ink); font-weight: 700; font-size: .95rem; margin-top: 8px; }
  .labels-note { font-size: .8rem; color: var(--muted); padding-top: 20px; border-top: 1px solid var(--hair); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="side" id="side">Noor</p>
      <h1 id="title">Summary</h1>
    </div>
    <div class="links">
      <a class="back" href="/review" id="review-link">Review</a>
      <a class="back" href="/" id="back">Back</a>
    </div>
  </header>

  <p class="status" id="status"></p>
  <div id="content" hidden>
  <div class="headline">
    <div><p class="big" id="visits">–</p><p class="big-label" id="visits-label">Visits</p></div>
    <div><p class="big" id="questions">–</p><p class="big-label" id="questions-label">Questions</p></div>
  </div>
  <label class="toggle"><input type="checkbox" id="hide-test" checked> <span id="hide-test-label">Hide test data</span></label>
  <p class="test-note" id="test-note" hidden></p>
  <p class="error-line" id="queue-error" hidden></p>

  <section>
    <h2 id="gaps-title"></h2>
    <p class="note" id="gaps-note"></p>
    <p class="note" id="gaps-machine"></p>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <section>
    <h2 id="outcomes-title"></h2>
    <div class="rows" id="outcomes"></div>
  </section>

  <section>
    <h2 id="reasons-title"></h2>
    <div class="rows" id="reasons"></div>
  </section>

  <section>
    <h2 id="commit-title"></h2>
    <p class="note" id="commit-note"></p>
    <div class="rows" id="commit"></div>
  </section>

  <section>
    <h2 id="intents-title"></h2>
    <div class="rows" id="intents"></div>
  </section>
  <p class="labels-note" id="labels-note" hidden></p>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function rows(target, items, total, L, emptyText) {
  target.replaceChildren();
  if (!items.length) { target.append(el("p", "empty", emptyText)); return; }
  for (const it of items) {
    const r = el("div", "row" + (it.accent ? " accent" : ""));
    r.append(el("span", "n", String(it.n)), el("span", "what", it.what));
    const bar = el("span", "bar"), fill = el("i");
    fill.style.width = (total ? Math.round(100 * it.n / total) : 0) + "%";
    bar.append(fill); r.append(bar);
    if (it.sub) r.append(el("span", "sub", it.sub));
    target.append(r);
  }
}

const KEY = new URLSearchParams(location.search).get("key") || "";
const withKey = (path) => path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY);
let LABELS = null;

async function labels() {
  if (!LABELS) LABELS = (await (await fetch("/api/labels")).json()).labels;
  return LABELS;
}

async function load() {
  const L0 = await labels();
  $("back").href = KEY ? withKey("/") : "/";
  $("review-link").href = withKey("/review");
  $("review-link").textContent = L0.open_review;
  $("hide-test-label").textContent = L0.hide_test;
  $("content").hidden = true;
  $("status").hidden = false;
  $("status").textContent = L0.loading;
  const includeTest = !$("hide-test").checked;
  const res = await fetch(withKey("/api/summary?include_test=" + (includeTest ? 1 : 0)));
  if (res.status === 401) { $("status").textContent = L0.key_required; return; }
  const d = await res.json();
  const L = d.labels;
  $("status").hidden = true;
  $("content").hidden = false;
  document.documentElement.lang = d.language.code;
  $("side").textContent = "Noor · " + d.language.name;
  for (const [id, key] of [["title", "title"], ["back", "back"], ["visits-label", "visits"], ["questions-label", "questions"],
                           ["gaps-title", "gaps_title"], ["gaps-note", "gaps_note"], ["gaps-machine", "machine_note"],
                           ["outcomes-title", "outcomes_title"], ["reasons-title", "reasons_title"],
                           ["commit-title", "commit_title"], ["commit-note", "commit_note"], ["intents-title", "intents_title"]]) {
    $(id).textContent = L[key];
  }
  // Interface labels are not spoken, so no banner; but say plainly if they are unchecked.
  // If the drafts file cannot be read, say so; the summary itself still works.
  $("queue-error").hidden = !d.queue_error; $("queue-error").textContent = d.queue_error || "";
  $("labels-note").hidden = d.labels_verified;
  $("labels-note").textContent = L.labels_note;
  $("visits").textContent = d.visits;
  $("questions").textContent = d.records;
  $("test-note").hidden = !d.test_records_all;
  $("test-note").textContent = d.include_test
    ? d.test_records + " / " + d.records + " · " + L.includes_test
    : d.test_records_all + " " + L.test_hidden;

  // The gap, most asked first.
  const gaps = $("gaps"); gaps.replaceChildren();
  // Empty sections: "nothing recorded yet" only when nothing has been; otherwise "none so far",
  // so an empty gap list never reads as if no one had asked anything.
  const none = d.records ? L.none_yet : L.empty;
  if (!d.gaps.length) gaps.append(el("li", "empty", none));
  for (const g of d.gaps) {
    const li = el("li", "gap");
    li.append(el("span", "count", g.count + "×"), el("span", "q-noor", g.question_noor), el("span", "q-en", g.question_en));
    if (g.variants.length) li.append(el("span", "variants", L.also_asked_as + ": " + g.variants.map(v => "“" + v.wording + "”" + (v.count > 1 ? " ×" + v.count : "")).join(" · ")));
    if (g.pending_id) li.append(el("span", "waiting", L.waiting_review));
    else li.append(draftButton(g, L, d.language.code));
    gaps.append(li);
  }

  const o = d.outcomes;
  rows($("outcomes"), [
    {n: o.answered, what: L.answered, accent: true},
    {n: o.handed_back, what: L.handed_back},
    {n: o.stopped_commitment, what: L.stopped_commitment},
    {n: o.stopped_known, what: L.stopped_known},
    {n: o.stopped_weak, what: L.stopped_weak},
    {n: o.stopped_unknown, what: L.stopped_unknown},
  ], d.records, L, none);
  const totalCommit = o.stopped_commitment;
  rows($("reasons"), Object.entries(d.commitment_reasons).map(([k, n]) => ({n, what: L["reason_" + k] || k})), totalCommit, L, none);
  rows($("commit"), d.commitment_entries.map(c => ({n: c.count, what: c.question_noor, sub: c.question_en + " · " + (L["reason_" + c.reason] || c.reason)})), totalCommit, L, none);
  rows($("intents"), Object.entries(d.intents).map(([k, n]) => ({n, what: L["intent_" + k] || k})), d.records, L, none);
}
// Drafting: Noor writes an answer to a question guests really asked. It becomes a
// pending entry built from those guests' exact words; it is never spoken until reviewed
// and added to the bank, which this page cannot do.
function draftButton(g, L, lang) {
  const b = el("button", "gap-act", L.write_answer);
  b.addEventListener("click", () => b.replaceWith(draftForm(g, L, lang)));
  return b;
}
function draftForm(g, L, lang) {
  const box = el("div", "draft");
  const ta = el("textarea"); ta.lang = lang; ta.maxLength = 400; ta.rows = 3;
  const hint = el("p", "hint", L.draft_hint), err = el("p", "error");
  const save = el("button", "primary", L.save_for_review), cancel = el("button", null, L.cancel);
  const btns = el("div", "row-btns"); btns.append(save, cancel);
  box.append(ta, hint, btns, err);
  cancel.addEventListener("click", () => box.replaceWith(draftButton(g, L, lang)));
  save.addEventListener("click", async () => {
    save.disabled = true; err.textContent = "";
    const r = await fetch(withKey("/api/drafts"), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paraphrases: g.transcripts, answer: ta.value }) });
    if (!r.ok) { err.textContent = (await r.json().catch(() => ({}))).detail || r.status; save.disabled = false; return; }
    box.replaceWith(el("span", "waiting", L.waiting_review));
  });
  setTimeout(() => ta.focus(), 0);
  return box;
}

$("hide-test").addEventListener("change", load);
load();
</script>
</body>
</html>
