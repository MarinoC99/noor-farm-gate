<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor's farm gate: review</title>
<style>
  /* Same system as the other pages: one accent, greys, type and space. Light only. */
  :root {
    color-scheme: light;
    --ink: #0d0d0d; --ink-2: #3a3a3a; --muted: #5c5c5c; --hair: #d4d4d4;
    --paper: #ffffff; --tint: #f4f4f2; --accent: #1d5c3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
               font: 20px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  p, h1, h2, ul { margin: 0; }
  main { max-width: 760px; margin: 0 auto;
         padding: calc(18px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                  calc(48px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .side { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  a.back { color: var(--ink); font-weight: 650; font-size: 1rem; text-decoration: none;
           border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; }
  h1 { font-size: 2rem; font-weight: 750; letter-spacing: -.01em; margin-top: 6px; }
  .note { font-size: .95rem; color: var(--muted); margin-top: 8px; }
  .status { font-size: 1.3rem; font-weight: 600; color: var(--ink-2); padding: 40px 0; }

  .draft { padding: 26px 0; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 14px; }
  .draft:first-of-type { margin-top: 22px; }
  .label { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .state { font-size: .95rem; font-weight: 700; color: var(--ink-2); }
  .state.reviewed { color: var(--accent); }
  .asked { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .asked li { font-size: 1.1rem; color: var(--ink-2); }
  .asked .asked-q { font-weight: 400; }
  .hint { font-size: .9rem; color: var(--muted); margin-top: -6px; }
  .noor { font-size: 1.6rem; font-weight: 750; line-height: 1.25; }
  textarea { font: inherit; font-size: 1.2rem; line-height: 1.3; padding: 12px 14px; min-height: 110px; width: 100%;
             border: 2px solid var(--ink); border-radius: 12px; resize: vertical; }
  .choice { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 1.05rem; }
  .choice label, .check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  input[type=radio], input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  select { font: inherit; font-size: 1.05rem; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
  .check { font-size: 1.05rem; font-weight: 600; }
  .btns { display: flex; gap: 10px; margin-top: 4px; }
  button { font: inherit; font-weight: 650; color: var(--ink); background: var(--paper);
           border: 2px solid var(--ink); border-radius: 12px; min-height: 56px; padding: 10px 18px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.quiet { border-color: var(--hair); color: var(--ink-2); }
  .error { color: var(--ink); font-weight: 700; font-size: .95rem; }
  .labels-note { font-size: .8rem; color: var(--muted); padding-top: 20px; margin-top: 8px; border-top: 1px solid var(--hair); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="side" id="side">Noor</p>
      <h1 id="title">Review</h1>
    </div>
    <a class="back" href="/summary" id="back">Back</a>
  </header>
  <p class="note" id="note"></p>
  <p class="status" id="status"></p>
  <div id="list"></div>
  <p class="labels-note" id="labels-note" hidden></p>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const KEY = new URLSearchParams(location.search).get("key") || "";
const withKey = (path) => path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY);
const INTENTS = ["", "general", "logistics", "money", "safety"];

function radio(name, value, text, checked) {
  const l = el("label"), i = el("input"); i.type = "radio"; i.name = name; i.value = value; i.checked = checked;
  l.append(i, el("span", null, text)); return l;
}
function check(text, checked) {
  const l = el("label", "check"), i = el("input"); i.type = "checkbox"; i.checked = checked;
  l.append(i, el("span", null, text)); return [l, i];
}

function render(d, L, lang) {
  const box = el("section", "draft");
  const state = el("p", "state" + (d.status === "reviewed" ? " reviewed" : ""),
                   (d.status === "reviewed" ? L.reviewed_state : L.pending_state) + (d.test_data ? " · " + L.test_marker : ""));
  // The summary's grouping by meaning is approximate: a different question can land in
  // the group. The reviewer can untick it; nothing can be added here.
  const asked = el("ul", "asked"), askedBoxes = [];
  for (const p of d.paraphrases_en) {
    const [l, i] = check("“" + p + "”", true); i.value = p; askedBoxes.push(i);
    l.classList.add("asked-q"); const li = el("li"); li.append(l); asked.append(li);
  }
  const noor = el("p", "noor", d["answer_" + lang] || ""); noor.lang = lang;

  // The English is written by a person here. Nothing fills it in.
  const en = el("textarea"); en.lang = "en"; en.maxLength = 400; en.value = d.answer_en || "";

  const cname = "c-" + d.id, cur = d.commitment;
  const commit = el("div", "choice");
  commit.append(radio(cname, "yes", L.commit_yes, cur === true), radio(cname, "no", L.commit_no, cur === false), radio(cname, "unsure", L.commit_unsure, cur !== true && cur !== false));

  const topic = el("select");
  for (const i of INTENTS) { const o = el("option", null, i ? (L["intent_" + i] || i) : "—"); o.value = i; o.selected = (d.intent || "") === i; topic.append(o); }

  const [vNoorL, vNoor] = check(L.verified_noor, !!(d.verified || {})[lang]);
  const [vEnL, vEn] = check(L.verified_en, !!(d.verified || {}).en);
  const save = el("button", "primary", L.save_review), discard = el("button", "quiet", L.discard), err = el("p", "error");
  const btns = el("div", "btns"); btns.append(save, discard);

  save.addEventListener("click", async () => {
    err.textContent = ""; save.disabled = true;
    const c = box.querySelector(`input[name="${cname}"]:checked`).value;
    const body = { answer_en: en.value, intent: topic.value || null,
                   paraphrases: askedBoxes.filter(i => i.checked).map(i => i.value),
                   commitment: c === "yes" ? true : c === "no" ? false : null,
                   verified: { [lang]: vNoor.checked, en: vEn.checked } };
    const r = await fetch(withKey("/api/drafts/" + d.id), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    save.disabled = false;
    if (!r.ok) { err.textContent = (await r.json().catch(() => ({}))).detail || r.status; return; }
    box.replaceWith(render(await r.json(), L, lang));   // only this card: others may hold unsaved edits
  });
  discard.addEventListener("click", async () => {
    if (!confirm(L.discard_confirm)) return;
    const r = await fetch(withKey("/api/drafts/" + d.id + "/discard"), { method: "POST" });
    if (!r.ok) { err.textContent = (await r.json().catch(() => ({}))).detail || r.status; return; }
    box.remove();
    if (!document.querySelector(".draft")) { $("status").hidden = false; $("status").textContent = L.no_drafts; }
  });

  box.append(state, el("p", "label", L.guests_asked), asked, el("p", "hint", L.asked_hint), el("p", "label", L.noor_wrote), noor,
             el("p", "label", L.english_answer), en, el("p", "label", L.commitment_q), commit,
             el("p", "label", L.topic), topic, vNoorL, vEnL, btns, err);
  return box;
}

async function load() {
  const LD = await (await fetch("/api/labels")).json(), L = LD.labels;
  // Interface labels are not spoken, so no banner; but say plainly if they are unchecked.
  $("labels-note").hidden = LD.labels_verified; $("labels-note").textContent = L.labels_note;
  $("title").textContent = L.review_title; $("note").textContent = L.review_note; $("back").textContent = L.back;
  $("back").href = withKey("/summary");
  $("status").hidden = false; $("status").textContent = L.loading_drafts;
  const r = await fetch(withKey("/api/drafts"));
  if (r.status === 401) { $("status").textContent = L.key_required; return; }
  if (!r.ok) { $("status").textContent = (await r.json().catch(() => ({}))).detail || r.status; return; }
  const d = await r.json();
  $("side").textContent = "Noor · " + d.language.name;
  const list = $("list"); list.replaceChildren();
  $("status").hidden = d.drafts.length > 0; $("status").textContent = L.no_drafts;
  for (const draft of d.drafts) list.append(render(draft, L, d.language.code));
}
load();
</script>
</body>
</html>
