<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor's farm gate</title>
<style>
  /* Daylight, simple: one accent, greys, type and space do the work. Light only. */
  :root {
    color-scheme: light;
    --ink: #0d0d0d; --ink-2: #3a3a3a; --muted: #5c5c5c; --hair: #d4d4d4;
    --paper: #ffffff; --tint: #f4f4f2;
    --accent: #1d5c3a; --accent-ink: #ffffff;
    --alert: #b00020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
               font: 20px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  p { margin: 0; }
  button { font: inherit; font-weight: 650; color: var(--ink); background: var(--paper);
           border: 2px solid var(--ink); border-radius: 14px; min-height: 84px; padding: 12px 20px;
           touch-action: manipulation; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .3; }

  /* Start: one screen, one action. */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 32px;
           align-items: center; justify-content: center; padding: 24px; }
  #start h1 { margin: 0; font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
  #start-btn { width: min(80vw, 440px); min-height: 132px; font-size: 2rem;
               background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* Two halves: a hairline and a faint tint, nothing heavier. */
  #conv { display: flex; height: 100%; }
  section { flex: 1; display: flex; flex-direction: column; overflow-y: auto; min-width: 0; }
  #guest { background: var(--paper); border-right: 1px solid var(--hair);
           padding-left: env(safe-area-inset-left); }
  #noor  { background: var(--tint); padding-right: env(safe-area-inset-right); }
  .band { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
          color: var(--muted); padding: 20px 24px 0; padding-top: calc(20px + env(safe-area-inset-top)); }
  .body { display: flex; flex-direction: column; gap: 14px; padding: 16px 24px 28px; }
  .label { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
           color: var(--muted); }
  .text { font-size: 1.5rem; font-weight: 600; min-height: 1.35em; }

  /* Language status: one thin line of small text. Quiet when verified, red when not. */
  .lang-status { font-size: .85rem; font-weight: 600; padding: 6px 24px 0; color: var(--muted); }
  .lang-status.unverified { color: var(--alert); font-weight: 750; }

  /* Guest */
  #talk { width: 100%; min-height: max(128px, 24vh); font-size: 1.8rem;
          background: var(--ink); border-color: var(--ink); color: #fff;
          user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #talk.rec { background: var(--accent); border-color: var(--accent); }
  .answer-card { font-size: 1.9rem; font-weight: 750; line-height: 1.25; }
  .answer-card:empty, .label:has(+ .answer-card:empty) { display: none; }
  #g-status { font-size: 1.05rem; font-weight: 600; color: var(--muted); }

  /* Noor: an answer to approve */
  .noor-answer { display: flex; flex-direction: column; gap: 18px; padding-top: 14px;
                 border-top: 1px solid var(--hair); }
  #n-question { font-weight: 500; color: var(--ink-2); }
  #n-answer { font-size: 2rem; font-weight: 750; line-height: 1.25; }
  #noor.unverified-mode #n-answer { color: var(--alert); }
  .actions { display: flex; gap: 12px; }
  #send { flex: 2 1 0; min-height: 112px; font-size: 1.9rem;
          background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  #decline { flex: 1 1 0; font-size: 1rem; padding: 10px 12px; border-color: var(--hair); color: var(--ink-2); }

  /* Noor: a stop. A deliberate pause: a quiet mark, the reason in small type, the phrase large. */
  .stop { display: flex; flex-direction: column; gap: 14px; padding: 18px 0 6px;
          border-top: 1px solid var(--hair); }
  .stop-head { display: flex; align-items: center; gap: 14px; }
  .pause { display: inline-flex; gap: 6px; }
  .pause::before, .pause::after { content: ""; width: 7px; height: 26px; border-radius: 2px; background: var(--ink); }
  .tag { font-size: .8rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .stop-phrase { font-size: 2.6rem; font-weight: 750; line-height: 1.15; letter-spacing: -.01em; }
  #n-stop-gloss { font-size: 1rem; color: var(--muted); }

  /* Phone upright: halves stack; Noor's gets more room. After the base rules so it wins. */
  @media (orientation: portrait) {
    #conv { flex-direction: column; }
    #guest { flex: 0 0 auto; border-right: 0; border-bottom: 1px solid var(--hair); }
    #noor { flex: 1 1 auto; }
    .band { padding: 10px 18px 0; padding-top: calc(10px + env(safe-area-inset-top)); }
    .lang-status { padding: 4px 18px 0; }
    .body { gap: 8px; padding: 8px 18px 10px; }
    #talk { min-height: 72px; font-size: 1.4rem; }
    .text { font-size: 1.15rem; }
    .answer-card { font-size: 1.4rem; }
    .noor-answer { gap: 12px; padding-top: 10px; }
    .noor-answer > .label { display: none; }
    #n-answer { font-size: 1.25rem; line-height: 1.2; }
    #send { min-height: 76px; font-size: 1.5rem; }
    #decline { min-height: 76px; font-size: .95rem; }
    .stop-phrase { font-size: 2rem; }
  }

  /* Phone in landscape: little height, so tighten everything that isn't the content. */
  @media (max-height: 500px) {
    html, body { font-size: 17px; }
    .band { padding: 10px 18px 0; padding-top: calc(10px + env(safe-area-inset-top)); }
    .lang-status { padding: 4px 18px 0; }
    .body { gap: 8px; padding: 8px 18px 14px; }
    #talk { min-height: 92px; font-size: 1.55rem; }
    .text { font-size: 1.2rem; }
    .answer-card, #n-answer { font-size: 1.25rem; line-height: 1.2; }
    .noor-answer { gap: 10px; padding-top: 8px; }
    .noor-answer > .label { display: none; }
    #send { min-height: 72px; font-size: 1.5rem; }
    #decline { min-height: 72px; font-size: .95rem; }
    .stop { gap: 8px; padding-top: 10px; }
    .stop-phrase { font-size: 2rem; }
  }

  /* Developer trace: tucked into a corner, out of the conversation's way. */
  #trace { position: fixed; left: calc(10px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom));
           max-width: min(92vw, 640px); max-height: 50vh; overflow: auto; z-index: 5;
           background: #fff; border: 1px solid var(--hair); border-radius: 10px; font-size: 12px; }
  #trace summary { padding: 6px 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  #trace pre { margin: 0; padding: 8px 12px; white-space: pre-wrap; }
  #trace:not([open]) { max-height: 40px; width: auto; overflow: hidden; }
  #trace:not([open]) pre { display: none; }
  @media (orientation: portrait) {   /* upright, the bottom is where Send lives: trace goes top-right */
    #trace { left: auto; right: 10px; bottom: auto; top: calc(8px + env(safe-area-inset-top)); }
  }
</style>
</head>
<body>

<!-- One screen, one action. Never opens onto a conversation. -->
<div id="start">
  <h1>Noor's farm gate</h1>
  <button id="start-btn">Start</button>
</div>

<main id="conv" hidden>
  <section id="guest" lang="en">
    <div class="band">Guest · English</div>
    <div class="body">
      <button id="talk">Hold to talk</button>
      <p class="label">You asked</p>
      <p id="g-question" class="text"></p>
      <p class="label">Answer</p>
      <p id="g-answer" class="answer-card"></p>
      <p id="g-status"></p>
    </div>
  </section>

  <!-- TODO(human): Noor's side labels are English placeholders. Noor-language labels
       need a speaker of that language; the coder does not write them (CLAUDE.md). -->
  <section id="noor">
    <div class="band" id="noor-side">Noor</div>
    <!-- CLAUDE.md rule 2b: verified or unverified, always visible. -->
    <div id="unverified-banner" class="lang-status" role="status" hidden></div>
    <div class="body">
      <p class="label">Guest asked · unchecked machine translation</p>
      <p id="n-question" class="text"></p>

      <div id="n-answer-block" class="noor-answer" hidden>
        <p class="label">Your answer</p>
        <p id="n-answer"></p>
        <div class="actions">
          <button id="send">Send ➜</button>
          <button id="decline">I'll answer myself</button>
        </div>
      </div>

      <div id="n-stop-block" class="stop" hidden>
        <div class="stop-head">
          <span class="pause" aria-hidden="true"></span>
          <span id="n-stop-tag" class="tag"></span>
        </div>
        <p id="n-stop" class="stop-phrase"></p>
        <p id="n-stop-gloss"></p>
      </div>
    </div>
  </section>
</main>

<details id="trace" hidden><summary>Trace</summary><pre id="trace-body"></pre></details>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let audioCtx = null, currentSource = null;
let recorder = null, stream = null, chunks = [];
let state = "idle";            // idle | starting | recording | working
let pressedAt = 0, releaseWhenStarted = false, maxTimer = null;
let exchangeId = null;

const MIME_TYPES = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"];
const mimeType = MIME_TYPES.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";

// ---- audio out: one AudioContext, unlocked once by the Start tap (iOS Safari) ----
function unlockAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const silent = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = silent; src.connect(audioCtx.destination); src.start(0);
  return audioCtx.resume();
}
function stopPlayback() { if (currentSource) { try { currentSource.stop(); } catch (e) {} currentSource = null; } }
async function play(speech) {
  if (!speech || !speech.audio_wav_b64) return;
  const bytes = Uint8Array.from(atob(speech.audio_wav_b64), c => c.charCodeAt(0));
  const buffer = await new Promise((ok, fail) => audioCtx.decodeAudioData(bytes.buffer, ok, fail));
  stopPlayback();
  await new Promise(done => {
    const s = audioCtx.createBufferSource();
    s.buffer = buffer; s.connect(audioCtx.destination); s.onended = done;
    currentSource = s; s.start();
  });
}

// ---- audio in: the mic is held only while recording, then released ----
async function openMic() {
  return navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
}
function closeMic() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

async function beginRecording() {
  state = "starting"; stopPlayback(); setTalk("Starting…");
  try { stream = await openMic(); }
  catch (e) { state = "idle"; setTalk("Hold to talk"); $("g-status").textContent = "Microphone blocked: " + e.message; return; }
  chunks = [];
  recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = onRecorded;
  recorder.onstart = () => {
    state = "recording"; setTalk("Listening… release when done", true);
    maxTimer = setTimeout(finishRecording, 15000);
    if (releaseWhenStarted) { releaseWhenStarted = false; finishRecording(); }
  };
  recorder.start();
}
function finishRecording() {
  clearTimeout(maxTimer);
  if (state === "starting") { releaseWhenStarted = true; return; }
  if (state !== "recording") return;
  state = "working"; setTalk("Working…");
  recorder.stop();
}
async function onRecorded() {
  closeMic();
  const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || mimeType || "application/octet-stream" });
  chunks = [];
  if (blob.size < 1000) { state = "idle"; setTalk("Hold to talk"); $("g-status").textContent = "Too short. Hold the button while you speak."; return; }
  try { await ask(blob); } catch (e) { $("g-status").textContent = "Error: " + e.message; }
  state = "idle"; setTalk("Hold to talk");
}
function setTalk(text, rec) { $("talk").textContent = text; $("talk").classList.toggle("rec", !!rec); }

// Hold to talk; a quick tap also works: tap to start, tap again to stop.
$("talk").addEventListener("pointerdown", e => {
  e.preventDefault();
  if (state === "idle") { pressedAt = performance.now(); releaseWhenStarted = false; beginRecording(); }
  else if (state === "recording" || state === "starting") { finishRecording(); }
});
function onRelease() {
  if ((state === "recording" || state === "starting") && performance.now() - pressedAt > 400) finishRecording();
}
$("talk").addEventListener("pointerup", onRelease);
$("talk").addEventListener("pointercancel", onRelease);
$("talk").addEventListener("contextmenu", e => e.preventDefault());

// ---- server ----
async function post(path, body, contentType) {
  const r = await fetch(path, { method: "POST", body, headers: contentType ? { "Content-Type": contentType } : {} });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  return r.json();
}
function showTrace(label, data) {
  const strip = (k, v) => (k.endsWith("_b64") ? (v ? `<${v.length} chars of base64 WAV>` : v) : v);
  $("trace-body").textContent = label + "\n" + JSON.stringify(data, strip, 2) + "\n\n" + $("trace-body").textContent;
}

function resetScreen() {
  exchangeId = null;
  for (const id of ["g-question", "g-answer", "g-status", "n-question", "n-answer", "n-stop", "n-stop-gloss"]) $(id).textContent = "";
  $("n-answer-block").hidden = true; $("n-stop-block").hidden = true;
}

async function ask(blob) {
  resetScreen();
  const r = await post("/api/ask", blob, blob.type);
  showTrace("POST /api/ask", r);
  $("g-question").textContent = r.transcript || "";
  if (!r.transcript) { $("g-status").textContent = "Didn't catch that. Try again."; return; }
  $("n-question").textContent = r.translation_noor;

  if (r.bank) {
    exchangeId = r.exchange_id;
    $("n-answer").textContent = r.bank.answer_noor;
    $("send").disabled = false; $("decline").disabled = false;
    $("n-answer-block").hidden = false;
    $("g-status").textContent = "Waiting for Noor…";
    await play(r.speech_question_noor);
    await play(r.bank.speech_answer_noor);
  } else if (r.stop) {
    $("n-stop-block").dataset.reason = r.stop.key;
    $("n-stop-tag").textContent = r.stop.reason_label;
    $("n-stop").textContent = r.stop.text_noor || "";
    $("n-stop-gloss").textContent = r.stop.gloss_en || "";
    $("n-stop-block").hidden = false;
    $("g-status").textContent = "Noor will answer you herself.";
    await play(r.speech_question_noor);
    await play(r.stop.speech_noor);
  }
}

$("send").addEventListener("click", async () => {
  if (!exchangeId) return;
  $("send").disabled = true; $("decline").disabled = true;
  let r;
  try { r = await post("/api/send", JSON.stringify({ exchange_id: exchangeId }), "application/json"); }
  catch (e) { $("g-status").textContent = "Could not send: " + e.message; return; }
  exchangeId = null;
  showTrace("POST /api/send", r);
  $("g-answer").textContent = r.answer_en; $("g-status").textContent = "";
  await play(r.speech_answer_en);
});
$("decline").addEventListener("click", async () => {
  if (!exchangeId) return;
  $("send").disabled = true; $("decline").disabled = true;
  let r;
  try { r = await post("/api/decline", JSON.stringify({ exchange_id: exchangeId }), "application/json"); }
  catch (e) { $("g-status").textContent = "Could not hand back: " + e.message; return; }
  exchangeId = null;
  showTrace("POST /api/decline", r);
  $("g-status").textContent = "Noor will answer you herself.";
});

// ---- the active language, and the unverified banner (rule 2b) ----
function showLanguage(info) {
  $("noor-side").textContent = "Noor · " + info.language.name;
  $("noor").lang = info.language.code;
  const status = $("unverified-banner"), lang = info.language.name_en;
  const unverified = !!info.noor_language_unverified;
  status.className = "lang-status " + (unverified ? "unverified" : "verified");
  status.textContent = unverified
    ? "Unverified: not checked by a " + lang + " speaker. Test mode."
    : "✓ Checked by a " + lang + " speaker";
  status.hidden = false;
  $("noor").classList.toggle("unverified-mode", unverified);
}

// ---- start: unlock audio inside the tap, ask for the mic once, begin a visit ----
$("start-btn").addEventListener("click", async () => {
  const unlocked = unlockAudio();          // must run synchronously inside the tap
  try {
    await unlocked;
    closeMic(); stream = await openMic(); closeMic();   // permission prompt now, not mid-question
    const info = await post("/api/start");
    showTrace("POST /api/start", info);
    showLanguage(info);
    $("start").hidden = true; $("conv").hidden = false; $("trace").hidden = false;
  } catch (e) {
    $("start-btn").textContent = "Start (" + e.message + ")";
  }
});

// For testing without a microphone: window.debugAsk(blob) runs a recording through the same path.
window.debugAsk = async (blob) => { state = "working"; try { await ask(blob); } finally { state = "idle"; } };
</script>
</body>
</html>
